name: gates
on: [push, pull_request]

# ONE PLATFORM ON PURPOSE — portable Common Lisp, no FFI, no platform calls.  The
# repos that genuinely differ per platform say so in their own workflows.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cl-nostr
          submodules: recursive

      # cl-nostr is one repo in a workspace of them, and the suite looks for siblings
      # beside it.  The list is the TRANSITIVE set — when it goes stale the failure is
      # "Component X not found", which reads like a broken build rather than a missing
      # line here.
      - name: Sibling checkouts
        run: |
          for repo in secp256k1-fast; do
            git clone --depth 1 -q https://github.com/modus-lisp/$repo.git "$repo"
          done

      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl

      # QUICKLISP, for ironclad.  This repo's crypto leans on it, and on a developer's
      # machine ~/.sbclrc has already loaded quicklisp before any gate runs -- which is
      # exactly why the suite passed everywhere except here.  A runner has no such file,
      # so the dependency has to be asked for out loud.
      - name: Quicklisp (ironclad)
        run: |
          curl -sSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load /tmp/quicklisp.lisp \
               --eval '(quicklisp-quickstart:install :path "~/quicklisp/")' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))'
          sbcl --non-interactive --eval '(ql:quickload :ironclad)'
      - name: Gate suite
        working-directory: cl-nostr
        run: sh inspect/run-all.sh
