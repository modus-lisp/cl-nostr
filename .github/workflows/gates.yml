name: gates
on: [push, pull_request]

# ONE PLATFORM ON PURPOSE — portable Common Lisp, no FFI, no platform calls.  The
# repos that genuinely differ per platform say so in their own workflows.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cl-nostr
          submodules: recursive

      # cl-nostr is one repo in a workspace of them, and the suite looks for siblings
      # beside it.  The list is the TRANSITIVE set — when it goes stale the failure is
      # "Component X not found", which reads like a broken build rather than a missing
      # line here.
      - name: Sibling checkouts
        run: |
          for repo in secp256k1-fast seal natrium json-simple cl-transport; do
            git clone --depth 1 -q https://github.com/modus-lisp/$repo.git "$repo"
          done

      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl

      # QUICKLISP, for the third-party libraries this repo depends on.  On a developer's
      # machine ~/.sbclrc has already loaded quicklisp before any gate runs, so these
      # arrive without anybody asking -- which is exactly why the suite passed
      # everywhere except here.  A runner has no such file.
      #
      # The list is every non-sibling, non-contrib dependency in the .asd files.  When
      # it goes stale the failure is "Component X not found", one library at a time.
      - name: Quicklisp dependencies
        run: |
          # RETRIED, because this is the one step that reaches the network and a
          # transient failure here is indistinguishable from a broken repository.
          # loom went red on "Connection reset by peer" mid-install and was diagnosed
          # as having a non-hermetic test suite; it did not, and its suite never ran.
          # A badge that goes red on somebody else's CDN teaches people to ignore it.
          for attempt in 1 2 3; do
            rm -rf ~/quicklisp
            curl -sSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp || { sleep 5; continue; }
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install :path "~/quicklisp/")' \
                 --eval '(ql-util:without-prompting (ql:add-to-init-file))' && break
            echo "quicklisp install attempt $attempt failed; retrying"
            sleep 10
          done
          sbcl --non-interactive --eval '(ql:quickload (list :bordeaux-threads :cl-base64))'
      - name: Gate suite
        working-directory: cl-nostr
        run: sh inspect/run-all.sh
